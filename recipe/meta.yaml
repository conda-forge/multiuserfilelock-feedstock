{% set version = "0.1.0" %}

package:
  name: multiuserfilelock
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/m/multiuserfilelock/multiuserfilelock-{{ version }}.tar.gz
  sha256: 07ac32ac58f367e56e81a223f13b0a17da6bc328cb702d55bc976ebaa803cf19

build:
  number: 0
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python {{ python_min }}
    - pip
    - setuptools
  run:
    - python >={{ python_min }}
    - filelock !=3.11.0,!=3.13.0

test:
  imports:
    - multiuserfilelock
  commands:
    - pip check
    - pytest --pyargs multiuserfilelock
  requires:
    - pip
    - pytest
    - python {{ python_min }}

about:
  home: https://github.com/ramonaoptics/python-multiuserfilelock
  summary: A lock to share resources between users based on filelock.
  license: BSD-3-Clause
  license_file: LICENSE

extra:
  recipe-maintainers:
    - hmaarrfk
